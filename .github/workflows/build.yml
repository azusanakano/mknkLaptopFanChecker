name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows Forms application
        shell: pwsh
        run: ./Build-Windows.ps1

      - name: Build native launcher
        shell: pwsh
        run: ./native-launcher-source/Build-NativeLauncher.ps1 -OutputDirectory ..

      - name: Run evaluator tests
        shell: pwsh
        run: dotnet run --project ./tests/EvaluatorTests.csproj -c Release

      - name: Reject dynamic libc++ and libunwind dependencies
        shell: pwsh
        run: |
          $imports = (dumpbin /dependents ./mknkLaptopFanChecker.exe | Out-String)
          $imports | Write-Host
          if ($imports -match '(?i)libc\+\+\.dll|libunwind\.dll') {
            throw 'Forbidden dynamic C++ runtime dependency detected.'
          }

      - name: Create release package
        shell: pwsh
        run: ./Package-Release.ps1 -OutputDirectory artifacts

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: NekoSystem-LaptopFanChecker-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
